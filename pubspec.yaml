name: merkez_bilgi_yarismasi
description: "Bilgi Yarışması merkez uygulaması. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: c940d60fdcbb22f7f737de465f2ed0c89de3a6b7
  # Merkezdeki oyunlar (her biri kendi deposunda)
  oyun_genel_kultur:
    git:
      url: https://github.com/taktemurr-ops/oyun-genel-kultur
      ref: 22cbdcf220a2c539d2a2d0d3a5cb825a5b554ce9
  oyun_hangisi_daha:
    git:
      url: https://github.com/taktemurr-ops/oyun-hangisi-daha
      ref: 6642563529a73a2413af87717c7b9162899eb09f
  oyun_dogru_mu_uydurma_mi:
    git:
      url: https://github.com/taktemurr-ops/oyun-dogru-mu-uydurma-mi
      ref: 7ce35327723c9230d5a894862cd1222658ea639a
  oyun_tahmin_ustasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-tahmin-ustasi
      ref: 452b4f2a7f542bd026fe7575b1548cfd6ce653cf
  oyun_sirala_bakalim:
    git:
      url: https://github.com/taktemurr-ops/oyun-sirala-bakalim
      ref: fdcb45c77750796acda4826d83629ad78f081b3d
  oyun_bilgi_duellosu:
    git:
      url: https://github.com/taktemurr-ops/oyun-bilgi-duellosu
      ref: 6217194014aae6e879e372161a0e2761b851cbb0
  oyun_dunya_haritasi_yerlestirme:
    git:
      url: https://github.com/taktemurr-ops/oyun-dunya-haritasi-yerlestirme
      ref: 9978a3c7c10f1883aa73a26bc0208ea4fd731dfa
  oyun_turkiye_illeri_ve_plakalar:
    git:
      url: https://github.com/taktemurr-ops/oyun-turkiye-illeri-ve-plakalar
      ref: 000461d8287fcfb7dd1331dcbf1e74d5e4e06777
  oyun_tarih_ve_tarihler:
    git:
      url: https://github.com/taktemurr-ops/oyun-tarih-ve-tarihler
      ref: 63a99759e99fcd234607945e04a6dcbac2e777bb
  oyun_dunya_mutfagi:
    git:
      url: https://github.com/taktemurr-ops/oyun-dunya-mutfagi
      ref: e0179dd6a8e7f942d89775737f81e85038ffea22
  oyun_elementler_ve_bilim:
    git:
      url: https://github.com/taktemurr-ops/oyun-elementler-ve-bilim
      ref: c423791abbf301af8707dcb2f5b8df3ec759c2ab
  oyun_hayvanlar_ve_doga:
    git:
      url: https://github.com/taktemurr-ops/oyun-hayvanlar-ve-doga
      ref: dca4bbf71e4f34c5b7af117d82b098b3c0fdcd65
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve motor sürümlerini kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: c940d60fdcbb22f7f737de465f2ed0c89de3a6b7
  bilgi_motoru:
    git:
      url: https://github.com/taktemurr-ops/bilgi-motoru
      ref: 5675ce076f8f3a1f5fa2210534f87917b4415ef3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
