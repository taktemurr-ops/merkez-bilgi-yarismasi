name: merkez_bilgi_yarismasi
description: "Bilgi Yarışması merkez uygulaması. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 03712efb1978a621943ed9b91d98e4fcad629898
  # Merkezdeki oyunlar (her biri kendi deposunda)
  oyun_genel_kultur:
    git:
      url: https://github.com/taktemurr-ops/oyun-genel-kultur
      ref: 76d0a105503fbe6805921db7456769450fe78bf6
  oyun_hangisi_daha:
    git:
      url: https://github.com/taktemurr-ops/oyun-hangisi-daha
      ref: 43884a885dde5aed21a7987b938b6a1d82b720c4
  oyun_dogru_mu_uydurma_mi:
    git:
      url: https://github.com/taktemurr-ops/oyun-dogru-mu-uydurma-mi
      ref: 2e106f1b7646f5c969f9d729d8b26acf490d69a1
  oyun_tahmin_ustasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-tahmin-ustasi
      ref: b961fe74b8bd8a019e6bfab1c193af42bb19128d
  oyun_sirala_bakalim:
    git:
      url: https://github.com/taktemurr-ops/oyun-sirala-bakalim
      ref: 60372613c319b078a266c835e9b8ed727ed0818a
  oyun_bilgi_duellosu:
    git:
      url: https://github.com/taktemurr-ops/oyun-bilgi-duellosu
      ref: f16cebf63a04b021664f9efac9d29002a00bec8b
  oyun_dunya_haritasi_yerlestirme:
    git:
      url: https://github.com/taktemurr-ops/oyun-dunya-haritasi-yerlestirme
      ref: eb5ddc8930c5e3b0211893fa1a7d6b11908d7b93
  oyun_turkiye_illeri_ve_plakalar:
    git:
      url: https://github.com/taktemurr-ops/oyun-turkiye-illeri-ve-plakalar
      ref: 335b178a99e144fe65ebe8d85a45015c83681ada
  oyun_tarih_ve_tarihler:
    git:
      url: https://github.com/taktemurr-ops/oyun-tarih-ve-tarihler
      ref: e975d440e7aa82609a88e6299fb3264f1a6bb510
  oyun_dunya_mutfagi:
    git:
      url: https://github.com/taktemurr-ops/oyun-dunya-mutfagi
      ref: 25a5e5a33dec28b59c85710483a9a5ab5d066b4d
  oyun_elementler_ve_bilim:
    git:
      url: https://github.com/taktemurr-ops/oyun-elementler-ve-bilim
      ref: aa3494b7fd223307887cfff3c85942dfb3845b7d
  oyun_hayvanlar_ve_doga:
    git:
      url: https://github.com/taktemurr-ops/oyun-hayvanlar-ve-doga
      ref: 43cce3048fa4e22bb4e8f31c65e522a74718d595
  oyun_spor_bilgisi:
    git:
      url: https://github.com/taktemurr-ops/oyun-spor-bilgisi
      ref: fab91f1ee3563607c8119ed72906380d9c111851
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve motor sürümlerini kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 03712efb1978a621943ed9b91d98e4fcad629898
  bilgi_motoru:
    git:
      url: https://github.com/taktemurr-ops/bilgi-motoru
      ref: 4777151ac1015ae0d8c987d871013f0790d22be2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/approved/
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
