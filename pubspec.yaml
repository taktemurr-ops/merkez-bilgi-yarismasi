dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve motor sürümlerini kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 8eb30b12914d385b8e8560df8e23e01310fde0c3
  bilgi_motoru:
    git:
      url: https://github.com/taktemurr-ops/bilgi-motoru
      ref: 171dbdd1e7858e3f188a0a5d10454c8d0482eeea

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/approved/
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
